{% extends 'tours/base.html' %}
{% block title %}Удалить тур{% endblock %}
{% block content %}
<h2>Удалить тур «{{ object.title }}»?</h2>
<form method="post">
  {% csrf_token %}
  <button type="submit">Да, удалить</button>
  <a class="btn" href="{{ object.get_absolute_url }}">Отмена</a>
</form>
{% endblock %}
